[platformio]
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
build_flags =
	-DUSBCON
	-DUSBD_USE_HID_COMPOSITE
	-DUSB_MANUFACTURER=\"FFB_Flight_Stick\"
	-DUSB_PRODUCT=\"FFB_Flight_Stick\"
monitor_speed = 115200

[env:native]
platform = native
; test_build_src is required for build_src_filter to apply to test builds.
; Without it PlatformIO links no project sources into the test binary and
; mixing.cpp is never compiled, so the tests fail to link.
test_build_src = yes
build_src_filter = -<*> +<mixing.cpp>
test_filter = test_mixing
