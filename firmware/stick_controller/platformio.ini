; Flash blackpill_f411ce onto the Blackpill F411. Test mixing math on the
; host (no board needed) with: pio test -e native

[platformio]
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
build_flags =
	-DUSBCON
	-DUSBD_USE_HID_COMPOSITE
	-DUSB_MANUFACTURER=\"FFB_Flight_Stick\"
	-DUSB_PRODUCT=\"FFB_Flight_Stick\"
monitor_speed = 115200

[env:native]
platform = native
build_src_filter = -<*> +<mixing.cpp>
test_filter = test_mixing
