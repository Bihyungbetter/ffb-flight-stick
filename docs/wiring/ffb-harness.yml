---
# FFB Flight Stick — interconnect harness
#
# Source of truth for every pin marked "(Pxx)" is the firmware:
#   firmware/motor_node/src/board_pins.h
#   firmware/stick_controller/src/main.cpp
#
# Pin *designators* written as "TBD-n" are NOT yet determined. They are
# placeholders, not guesses. docs/wiring/NOTES.md says what document resolves
# each one, and lists the firmware/BOM discrepancies this diagram surfaced.
# Do not build from a TBD pin.
#
# Designators. The suffix 0/1 always means motor node 0/1, matching link0 and
# link1 in stick_controller/src/main.cpp:
#
#   DRV0 DRV1    FOC driver boards. Named DRV, not ESC, because the part
#                itself is called "B-G431B-ESC1" — an ESC1 designator would
#                be ambiguous with the board model.
#   MOT0 MOT1    Motors
#   ENC0 ENC1    AS5047P encoders
#   MCU          Stick controller (Blackpill)
#   POT          Throttle potentiometer
#   PSU  SPLIT   12 V supply and its distribution point
#   HOST         Host PC
#   W_*          Cables. W_LINK0/W_LINK1 carry the link0/link1 UARTs.
#
# Render:  wireviz docs/wiring/ffb-harness.yml
# Outputs: ffb-harness.svg / .png / .html / .bom.tsv

metadata:
  title: FFB Flight Stick — Interconnect Harness
  description: >-
    Two BLDC motors, each on its own FOC driver node, report angle and velocity
    to a central STM32F411 stick controller over UART. The controller unmixes
    the two motor angles into pitch/roll, computes force-feedback torques,
    mixes them back to per-motor torques, and presents pitch/roll to the host
    as a USB HID joystick.
  revision: A (draft — contains unresolved TBD pins, see NOTES.md)

options:
  fontname: Arial
  bgcolor: WH
  color_mode: FULL

# ---------------------------------------------------------------------------
# Connectors / modules
# ---------------------------------------------------------------------------

connectors:

  PSU:
    type: DC supply
    subtype: 12 V
    pinlabels: [+12V, GND]
    notes: 12 V per driver.voltage_power_supply (motor_node/src/main.cpp).

  SPLIT:
    type: Power distribution
    subtype: screw terminal / bus bar
    pinlabels: [+12V, +12V, +12V, GND, GND, GND]
    notes: Star point for the 12 V rail; one supply feeds both nodes.

  # --- Motor node 0 -------------------------------------------------------
  DRV0:
    type: ST B-G431B-ESC1
    subtype: FOC gate driver (motor node 0)
    pins:
      [VIN+, VIN-, U, V, W, TBD-1, TBD-2, TBD-3, TBD-4, TBD-5, TBD-6, TBD-7, TBD-8, TBD-9]
    pinlabels:
      - +12V in
      - GND in
      - Phase U
      - Phase V
      - Phase W
      - J3 UART TX (PA2)
      - J3 UART RX (PA3)
      - J3 GND
      - J8 +3V3
      - J8 GND
      - J8 SPI SCK
      - J8 SPI MISO
      - J8 SPI MOSI
      - J8 SPI CS (PA4)
    notes: >-
      TBD-1..3 on J3, TBD-4..9 on J8; pin numbers from UM2516.
      PA2/PA3/PA4 may not be free GPIO — NOTES.md #3.

  MOT0:
    type: GM5208-24 gimbal motor
    subtype: 3-phase BLDC (motor 0)
    pinlabels: [U, V, W]
    notes: >-
      Phase order sets direction. If an axis is inverted, swap two phases
      OR flip the sign in mixing.cpp — not both.

  ENC0:
    type: AS5047P breakout
    subtype: absolute magnetic encoder (motor 0)
    pinlabels: ["3V3", GND, CLK, MISO, MOSI, CSn]
    notes: Diametric magnet centred on the motor 0 rotor shaft end.

  # --- Motor node 1 -------------------------------------------------------
  DRV1:
    type: ST B-G431B-ESC1
    subtype: FOC gate driver (motor node 1)
    pins:
      [VIN+, VIN-, U, V, W, TBD-1, TBD-2, TBD-3, TBD-4, TBD-5, TBD-6, TBD-7, TBD-8, TBD-9]
    pinlabels:
      - +12V in
      - GND in
      - Phase U
      - Phase V
      - Phase W
      - J3 UART TX (PA2)
      - J3 UART RX (PA3)
      - J3 GND
      - J8 +3V3
      - J8 GND
      - J8 SPI SCK
      - J8 SPI MISO
      - J8 SPI MOSI
      - J8 SPI CS (PA4)
    notes: >-
      Same firmware and pin map as DRV0 — nodes differ only by which
      stick-controller UART they land on.

  MOT1:
    type: GM5208-24 gimbal motor
    subtype: 3-phase BLDC (motor 1)
    pinlabels: [U, V, W]

  ENC1:
    type: AS5047P breakout
    subtype: absolute magnetic encoder (motor 1)
    pinlabels: ["3V3", GND, CLK, MISO, MOSI, CSn]
    notes: Diametric magnet centred on the motor 1 rotor shaft end.

  # --- Stick controller ---------------------------------------------------
  MCU:
    type: WeAct Blackpill
    subtype: STM32F411CEU6 (UFQFPN48)
    pins:
      [PA10, PA9, G1, TBD-A, TBD-B, G2, TBD-C, "3V3", G3, USB]
    pinlabels:
      - link0 RX (PA10)
      - link0 TX (PA9)
      - GND
      - link1 RX (unassigned)
      - link1 TX (unassigned)
      - GND
      - Throttle wiper (unassigned)
      - +3V3 out
      - GND
      - USB-C to host
    notes: >-
      link1 asks for PC10/PC11, which do not exist on UFQFPN48 — NOTES.md #1.
      link0 collides with Serial1 — NOTES.md #2.
      RX/TX below is the corrected mapping, NOT main.cpp's argument order — #2.
      Throttle has no ADC pin in firmware — NOTES.md #4.

  POT:
    type: Bourns PDB181-K415K-103B
    subtype: 10 k linear potentiometer
    pinlabels: [CCW end, Wiper, CW end]
    notes: Throttle lever position. 100 nF wiper-to-GND recommended.

  HOST:
    type: PC
    subtype: USB host
    pinlabels: [USB-C]
    notes: Enumerates as HID joystick "FFB_Flight_Stick" (X = roll, Y = pitch).

# ---------------------------------------------------------------------------
# Cables
# ---------------------------------------------------------------------------

cables:

  W_PSU:
    category: bundle
    gauge: 18 AWG
    length: 0.5
    colors: [RD, BK]
    notes: Supply to distribution point.

  W_PWR0:
    category: bundle
    gauge: 18 AWG
    length: 0.3
    colors: [RD, BK]

  W_PWR1:
    category: bundle
    gauge: 18 AWG
    length: 0.3
    colors: [RD, BK]

  W_PH0:
    category: bundle
    gauge: 18 AWG
    length: 0.25
    colors: [YE, GN, BU]
    notes: Motor 0 phases. Keep short and twisted; route clear of W_ENC0.

  W_PH1:
    category: bundle
    gauge: 18 AWG
    length: 0.25
    colors: [YE, GN, BU]
    notes: Motor 1 phases. Keep short and twisted; route clear of W_ENC1.

  W_ENC0:
    gauge: 28 AWG
    length: 0.2
    shield: true
    colors: [RD, BK, YE, GN, BU, WH]
    notes: >-
      Motor 0 encoder SPI. Shield grounded at the DRV0 end only. Noise here
      becomes angle glitches that the FOC loop will act on.

  W_ENC1:
    gauge: 28 AWG
    length: 0.2
    shield: true
    colors: [RD, BK, YE, GN, BU, WH]
    notes: Motor 1 encoder SPI. Same shielding rules as W_ENC0.

  W_LINK0:
    gauge: 28 AWG
    length: 0.4
    shield: true
    colors: [OG, BN, BK]
    notes: >-
      921600 baud, stick controller to motor node 0. TX/RX cross over.
      Common GND required.

  W_LINK1:
    gauge: 28 AWG
    length: 0.4
    shield: true
    colors: [OG, BN, BK]
    notes: 921600 baud, stick controller to motor node 1. Same rules as W_LINK0.

  W_POT:
    gauge: 28 AWG
    length: 0.6
    colors: [RD, WH, BK]
    notes: Throttle pot. Destination ADC pin unassigned — NOTES.md #4.

  W_USB:
    category: bundle
    length: 1.0
    colors: [BK]
    notes: USB-C data cable to the host PC.

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------

connections:

  # --- 12 V distribution ---
  -
    - PSU: [+12V, GND]
    - W_PSU: [1-2]
    - SPLIT: [1, 4]

  -
    - SPLIT: [2, 5]
    - W_PWR0: [1-2]
    - DRV0: [VIN+, VIN-]

  -
    - SPLIT: [3, 6]
    - W_PWR1: [1-2]
    - DRV1: [VIN+, VIN-]

  # --- Motor phases ---
  -
    - DRV0: [U, V, W]
    - W_PH0: [1-3]
    - MOT0: [U, V, W]

  -
    - DRV1: [U, V, W]
    - W_PH1: [1-3]
    - MOT1: [U, V, W]

  # --- Encoder SPI (node 0) ---
  -
    - DRV0: [TBD-4, TBD-5, TBD-6, TBD-7, TBD-8, TBD-9]
    - W_ENC0: [1-6]
    - ENC0: ["3V3", GND, CLK, MISO, MOSI, CSn]

  # --- Encoder SPI (node 1) ---
  -
    - DRV1: [TBD-4, TBD-5, TBD-6, TBD-7, TBD-8, TBD-9]
    - W_ENC1: [1-6]
    - ENC1: ["3V3", GND, CLK, MISO, MOSI, CSn]

  # --- Telemetry / command UART, node 0 (DRV TX -> MCU RX) ---
  -
    - DRV0: [TBD-1, TBD-2, TBD-3]
    - W_LINK0: [1-3]
    - MCU: [PA10, PA9, G1]

  # --- Telemetry / command UART, node 1 (DRV TX -> MCU RX) ---
  -
    - DRV1: [TBD-1, TBD-2, TBD-3]
    - W_LINK1: [1-3]
    - MCU: [TBD-A, TBD-B, G2]

  # --- Throttle ---
  -
    - MCU: ["3V3", TBD-C, G3]
    - W_POT: [1-3]
    - POT: [CW end, Wiper, CCW end]

  # --- Host ---
  -
    - MCU: [USB]
    - W_USB: [1]
    - HOST: [USB-C]
